  - {id: 21, name: r_thumb,          board: 1, channel: 5,  min: 20,  max: 160, home: 20, speed: 300}
  - {id: 22, name: r_index,          board: 1, channel: 6,  min: 20,  max: 160, home: 20, speed: 300}
  - {id: 23, name: r_middle,         board: 1, channel: 7,  min: 20,  max: 160, home: 20, speed: 300}
  - {id: 24, name: r_ring,           board: 1, channel: 8,  min: 20,  max: 160, home: 20, speed: 300}
  - {id: 25, name: r_pinky,          board: 1, channel: 9,  min: 20,  max: 160, home: 20, speed: 300}
  # --- left arm + hand (board 2) ---
  - {id: 32, name: l_shoulder_pitch, board: 2, channel: 0,  min: 0,   max: 180, home: 10}
  - {id: 33, name: l_shoulder_roll,  board: 2, channel: 1,  min: 0,   max: 110, home: 10}
