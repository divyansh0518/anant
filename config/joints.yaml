  - {id: 38, name: l_index,          board: 2, channel: 6,  min: 20,  max: 160, home: 20, speed: 300}
  - {id: 39, name: l_middle,         board: 2, channel: 7,  min: 20,  max: 160, home: 20, speed: 300}
  - {id: 40, name: l_ring,           board: 2, channel: 8,  min: 20,  max: 160, home: 20, speed: 300}
  - {id: 41, name: l_pinky,          board: 2, channel: 9,  min: 20,  max: 160, home: 20, speed: 300}
