# ANANT joint map.  id = board*16 + channel.   Angles are servo degrees.
# This is a TEMPLATE: calibrate min / max / home / sign for every servo on your build.
# Flip `sign` (+1 / -1) if a joint moves opposite to the XR operator's motion.
pca9685_addresses: [0x40, 0x41, 0x42]
default_speed_dps: 120
joints:
  # --- head (board 0) ---
  - {id: 0,  name: neck_yaw,         board: 0, channel: 0,  min: 30,  max: 150, home: 90}
  - {id: 1,  name: neck_pitch,       board: 0, channel: 1,  min: 60,  max: 120, home: 90}
  - {id: 2,  name: neck_roll,        board: 0, channel: 2,  min: 70,  max: 110, home: 90}
  - {id: 3,  name: jaw,              board: 0, channel: 3,  min: 70,  max: 105, home: 70, speed: 400}
  - {id: 4,  name: eye_yaw,          board: 0, channel: 4,  min: 60,  max: 120, home: 90, speed: 300}
  - {id: 5,  name: eye_pitch,        board: 0, channel: 5,  min: 70,  max: 110, home: 90, speed: 300}
  - {id: 6,  name: eyelid_l,         board: 0, channel: 6,  min: 40,  max: 110, home: 100, speed: 600}
  - {id: 7,  name: eyelid_r,         board: 0, channel: 7,  min: 40,  max: 110, home: 100, speed: 600}
  # --- silicone face actuation (board 0) ---
  - {id: 8,  name: brow_l,           board: 0, channel: 8,  min: 50,  max: 130, home: 90}
  - {id: 9,  name: brow_r,           board: 0, channel: 9,  min: 50,  max: 130, home: 90}
  - {id: 10, name: mouth_corner_l,   board: 0, channel: 10, min: 40,  max: 140, home: 90}
  - {id: 11, name: mouth_corner_r,   board: 0, channel: 11, min: 40,  max: 140, home: 90}
  - {id: 12, name: cheek_l,          board: 0, channel: 12, min: 60,  max: 130, home: 90}
  - {id: 13, name: cheek_r,          board: 0, channel: 13, min: 60,  max: 130, home: 90}
  # --- right arm + hand (board 1) ---
  - {id: 16, name: r_shoulder_pitch, board: 1, channel: 0,  min: 0,   max: 180, home: 10}
  - {id: 17, name: r_shoulder_roll,  board: 1, channel: 1,  min: 0,   max: 110, home: 10}
  - {id: 18, name: r_shoulder_yaw,   board: 1, channel: 2,  min: 30,  max: 150, home: 90}
  - {id: 19, name: r_elbow,          board: 1, channel: 3,  min: 10,  max: 150, home: 10}
